name: Agent toolkit tests

on:
  push:
    branches: [master, main]
    paths:
      - "tools/agent-toolkit/**"
      - "docs/agent-toolkit/**"
      - ".github/workflows/agent-toolkit.yml"
  pull_request:
    paths:
      - "tools/agent-toolkit/**"
      - "docs/agent-toolkit/**"
      - ".github/workflows/agent-toolkit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests (no tool installs or external services)
        run: npm test --prefix tools/agent-toolkit
      - name: Offline profile listing
        run: node tools/agent-toolkit/toolkit.mjs profile list
