name: Notion scripts tests

on:
  push:
    branches: [master, main]
    paths:
      - "docs/notion/**"
      - "tools/agent-toolkit/**"
      - ".github/workflows/notion-scripts.yml"
  pull_request:
    paths:
      - "docs/notion/**"
      - "tools/agent-toolkit/**"
      - ".github/workflows/notion-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    defaults:
      run:
        working-directory: docs/notion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: docs/notion/package-lock.json
      - run: npm ci --no-fund
      - run: npm audit --audit-level=high --omit=dev
      - name: Syntax check
        run: node --check cli.mjs && node --check notion.mjs && node --check boards.mjs && node --check discovery.mjs && node --check api.mjs
      - run: npm test
      - name: CLI smoke test (no token, no network)
        run: node cli.mjs boards --definitions
